name: Kernel Build

   on:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
       - name: Checkout kernel source
         uses: actions/checkout@v4
         
       - name: Fix Git ownership issue
         run: git config --global --add safe.directory /github/workspace

       - name: Set up MemKernel as a module
         run: |
           curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M nero

       - name: Android kernel build
         uses: android-kernel-builder/android-kernel-build-action@v1
         id: build
         env:
           NAME: noticesax
         with:
           arch: arm64
           toolchain: aarch64-linux-android-4.9
           defconfig: merlin.config
           image: Image.gz-dtb

       - name: Upload Kernel and Module
         uses: actions/upload-artifact@v4
         with:
           name: module
           path: |
             ${{ steps.build.outputs.outfile }}
             ./out/drivers/memkernel/memkernel.ko
